<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2100 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e6f2"/>
      <stop offset="0.55" stop-color="#eef1f4"/>
      <stop offset="1" stop-color="#f8eeee"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6ef" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#fbe3dc" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbe3dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cddcea"/>
      <stop offset="1" stop-color="#e6eef4"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9cbb8"/>
      <stop offset="1" stop-color="#dcebe2"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <g id="blossom">
      <ellipse cx="0" cy="-11" rx="7" ry="11"/>
      <ellipse cx="0" cy="-11" rx="7" ry="11" transform="rotate(72)"/>
      <ellipse cx="0" cy="-11" rx="7" ry="11" transform="rotate(144)"/>
      <ellipse cx="0" cy="-11" rx="7" ry="11" transform="rotate(216)"/>
      <ellipse cx="0" cy="-11" rx="7" ry="11" transform="rotate(288)"/>
      <circle r="3.5" fill="#c9667f"/>
    </g>
    <path id="petal" d="M0 0 C6 -8 14 -6 12 2 C10 8 3 9 0 0 Z"/>
  </defs>

  <!-- sky -->
  <rect width="2100" height="1000" fill="url(#sky)"/>
  <circle cx="1480" cy="270" r="260" fill="url(#sunglow)"/>
  <circle cx="1480" cy="270" r="74" fill="#fff8f3"/>

  <!-- soft clouds -->
  <g fill="#ffffff" opacity="0.7" filter="url(#blur)">
    <ellipse cx="420" cy="200" rx="260" ry="34"/>
    <ellipse cx="1180" cy="150" rx="200" ry="26"/>
    <ellipse cx="1820" cy="380" rx="240" ry="30"/>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#5d6f86" stroke-width="3.5" stroke-linecap="round" opacity="0.7">
    <path d="M1180 300 q12 -10 24 0 q12 -10 24 0"/>
    <path d="M1250 260 q9 -8 18 0 q9 -8 18 0"/>
    <path d="M1300 320 q8 -7 16 0 q8 -7 16 0"/>
  </g>

  <!-- far mountains -->
  <path d="M0 610 L180 560 L330 590 L560 430 Q610 395 660 430 L900 575 L1100 545 L1320 590 L1560 520 L1800 575 L2100 540 L2100 700 L0 700 Z" fill="#c3d2e2"/>
  <path d="M560 430 Q610 395 660 430 L700 455 L672 452 L650 470 L628 450 L604 466 L585 448 L548 458 Z" fill="#f6f8fb"/>
  <path d="M0 640 L240 600 L460 630 L720 585 L980 625 L1250 595 L1500 630 L1760 600 L2100 625 L2100 720 L0 720 Z" fill="#b2c6d6" opacity="0.85"/>

  <!-- lake -->
  <rect x="0" y="650" width="2100" height="180" fill="url(#lake)"/>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="260" y1="680" x2="380" y2="680"/>
    <line x1="520" y1="705" x2="600" y2="705"/>
    <line x1="1380" y1="690" x2="1520" y2="690"/>
    <line x1="1700" y1="712" x2="1780" y2="712"/>
  </g>
  <!-- sun reflection -->
  <g stroke="#fbe3dc" stroke-width="5" stroke-linecap="round">
    <line x1="1440" y1="672" x2="1520" y2="672"/>
    <line x1="1455" y1="690" x2="1505" y2="690"/>
  </g>

  <!-- mist -->
  <ellipse cx="900" cy="650" rx="700" ry="30" fill="#ffffff" opacity="0.6" filter="url(#blur)"/>

  <!-- two people sitting side by side, seen from behind -->
  <g transform="translate(1035 600)">
    <!-- left person: indigo sweater -->
    <path d="M-62 150 C-66 90 -52 50 -14 42 L14 42 C52 50 66 90 62 150 Z" fill="#7d9bbb"/>
    <path d="M-30 46 C-30 28 30 28 30 46" fill="#6c8aab"/>
    <circle cx="0" cy="8" r="34" fill="#2e3542"/>
    <path d="M-34 10 C-38 40 -26 54 -20 56 L20 56 C26 54 38 40 34 10 Z" fill="#2e3542"/>
  </g>
  <g transform="translate(1195 596)">
    <!-- right person: sakura sweater -->
    <path d="M-60 154 C-64 92 -50 52 -14 44 L14 44 C50 52 64 92 60 154 Z" fill="#eec7d0"/>
    <circle cx="0" cy="8" r="32" fill="#3a3330"/>
    <circle cx="4" cy="-30" r="16" fill="#3a3330"/>
    <rect x="-10" y="36" width="20" height="12" rx="4" fill="#f1d7c8"/>
  </g>

  <g transform="translate(1035 600)">
    <path d="M40 72 C78 56 104 52 128 54" fill="none" stroke="#7d9bbb" stroke-width="20" stroke-linecap="round"/>
    <circle cx="134" cy="55" r="10" fill="#f1d7c8"/>
  </g>
  <!-- near hill -->
  <path d="M0 790 C350 700 700 690 1050 720 C1400 750 1750 700 2100 735 L2100 1000 L0 1000 Z" fill="url(#hillNear)"/>
  <path d="M0 860 C420 800 900 830 1300 840 C1650 850 1900 820 2100 830 L2100 1000 L0 1000 Z" fill="#e7f1eb"/>

  <!-- grass tufts & flowers -->
  <g stroke="#7fae93" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M820 770 q4 -20 0 -34 M828 770 q6 -18 12 -26 M812 770 q-4 -16 -12 -22"/>
    <path d="M1420 780 q4 -20 0 -34 M1428 780 q6 -18 12 -26 M1412 780 q-4 -16 -12 -22"/>
    <path d="M1650 760 q4 -18 0 -30 M1658 760 q6 -16 12 -22"/>
  </g>
  <g fill="#ffffff">
    <circle cx="760" cy="800" r="5"/><circle cx="900" cy="790" r="4"/>
    <circle cx="1350" cy="805" r="5"/><circle cx="1560" cy="790" r="4"/>
    <circle cx="1700" cy="810" r="5"/><circle cx="640" cy="815" r="4"/>
  </g>

  <!-- sakura branch, top left -->
  <g fill="none" stroke="#6e5f63" stroke-linecap="round">
    <path d="M-20 70 C120 90 230 140 340 210 C420 260 470 300 520 320" stroke-width="14"/>
    <path d="M200 125 C230 70 270 40 320 30" stroke-width="7"/>
    <path d="M340 210 C380 200 420 210 460 240" stroke-width="6"/>
    <path d="M110 92 C120 140 110 180 90 210" stroke-width="6"/>
  </g>
  <g fill="#f6cdd8">
    <use href="#blossom" xlink:href="#blossom" transform="translate(320 30) scale(1.3)"/>
    <use href="#blossom" xlink:href="#blossom" transform="translate(270 52) scale(1.1) rotate(20)"/>
    <use href="#blossom" xlink:href="#blossom" transform="translate(460 240) scale(1.25) rotate(10)"/>
    <use href="#blossom" xlink:href="#blossom" transform="translate(520 320) scale(1.35)"/>
    <use href="#blossom" xlink:href="#blossom" transform="translate(90 210) scale(1.2) rotate(30)"/>
    <use href="#blossom" xlink:href="#blossom" transform="translate(395 205) scale(1.0) rotate(45)"/>
  </g>
  <g fill="#eeaabd">
    <use href="#blossom" xlink:href="#blossom" transform="translate(230 140) scale(1.15) rotate(15)"/>
    <use href="#blossom" xlink:href="#blossom" transform="translate(150 100) scale(1.0) rotate(50)"/>
    <use href="#blossom" xlink:href="#blossom" transform="translate(480 290) scale(0.95) rotate(25)"/>
    <use href="#blossom" xlink:href="#blossom" transform="translate(115 160) scale(0.9)"/>
  </g>

  <!-- falling petals -->
  <g fill="#f2bccb">
    <use href="#petal" xlink:href="#petal" transform="translate(640 380) rotate(20) scale(1.4)"/>
    <use href="#petal" xlink:href="#petal" transform="translate(780 260) rotate(-30) scale(1.2)"/>
    <use href="#petal" xlink:href="#petal" transform="translate(980 420) rotate(60) scale(1.3)"/>
    <use href="#petal" xlink:href="#petal" transform="translate(560 520) rotate(110) scale(1.1)"/>
    <use href="#petal" xlink:href="#petal" transform="translate(1250 470) rotate(-60) scale(1.2)"/>
    <use href="#petal" xlink:href="#petal" transform="translate(860 560) rotate(30) scale(1.0)"/>
  </g>
</svg>
